name: Android CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties (non-secret config)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "NAVER_CLIENT_ID=${{ vars.NAVER_CLIENT_ID }}" >> local.properties
          echo "NAVER_REDIRECT_URI=${{ vars.NAVER_REDIRECT_URI }}" >> local.properties
          echo "NAVER_TOKEN_EXCHANGE_URL=${{ vars.NAVER_TOKEN_EXCHANGE_URL }}" >> local.properties
          echo "AI_PROXY_BASE_URL=${{ vars.AI_PROXY_BASE_URL }}" >> local.properties

      - name: Release signing (only when secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit + Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug / release / bundle
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload APK / AAB
        uses: actions/upload-artifact@v4
        with:
          name: aistudio-v1.0.0
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            docs/screenshots/
